name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Show files
        run: find . -not -path './.git/*' | head -50
      - name: Build
        run: mvn -B package -f "$(find . -name pom.xml | head -n1)"
      - uses: actions/upload-artifact@v4
        with:
          name: StaffMode
          path: "**/target/StaffMode.jar"
